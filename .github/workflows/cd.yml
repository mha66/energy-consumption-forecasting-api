name: Continuous Deployment

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install DVC
        run: |
          python -m pip install --upgrade pip
          pip install dvc dvc-s3

      - name: Pull Data and Model via DVC
        env:
          # DagsHub uses the token as both the AWS access key and secret key
          AWS_ACCESS_KEY_ID: ${{ secrets.DAGSHUB_TOKEN }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          # Download the real deployed_model and data directories
          dvc pull deployed_model.dvc

      - name: Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Format Repository Name
        # Docker image names must be entirely lowercase
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ env.REPO }}:latest
          # Reuses unchanged Docker layers to drastically speed up CD runs
          cache-from: type=registry,ref=ghcr.io/${{ env.REPO }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ env.REPO }}:buildcache,mode=max

      - name: Trigger Render Deploy Hook
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}