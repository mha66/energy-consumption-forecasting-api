name: MLOps CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        # pip install pytest httpx
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint with Ruff
        run: |
          # The github output format annotates your PRs directly in the GitHub UI
          ruff check --output-format=github .

      - name: Pull Data and Model via DVC
        env:
          # Pulls the secret from GitHub securely
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
          DAGSHUB_USERNAME: "mha66" 
        run: |
          # Configure DVC to use HTTP basic auth for this local runner
          # Note: Replace 'origin' if you named your DVC remote something else
          dvc remote modify origin --local auth basic
          dvc remote modify origin --local user $DAGSHUB_USERNAME
          dvc remote modify origin --local password $DAGSHUB_TOKEN
          
          # Download the real deployed_model and data directories
          dvc pull

      - name: Run Pytest Suite
        run: |
          python -m pytest -v

      - name: Verify Docker Build
        run: |
          docker build -t energy-forecast-api:test .